[package]
name = "mind-mesh-agent"
description = "adk-rust agents and tools for MindMesh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["opencode"]
opencode = ["dep:adk-acp"]
ts-export = ["dep:ts-rs", "mind-mesh-core/ts-export"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
ts-rs = { workspace = true, optional = true }

adk-agent.workspace = true
adk-core.workspace = true
adk-model.workspace = true
adk-runner.workspace = true
adk-session.workspace = true
adk-tool.workspace = true
adk-acp = { workspace = true, optional = true }
agent-client-protocol.workspace = true

dotenvy.workspace = true
mind-mesh-core.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile = "3"
