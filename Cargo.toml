[workspace]
resolver = "2"
members = [
    "crates/terrain-core",
    "crates/terrain-agent",
    "crates/terrain-cli",
    "crates/terrain-ts-export",
    "src-tauri",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
slug = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2"
ignore = "0.4"
futures = "0.3"
dotenvy = "0.15"
sys-locale = "0.3"

adk-acp = "1.0.0"
# OpenCode sends `usage_update`; enable until ACP SDK stabilizes it upstream.
agent-client-protocol = { version = "0.11.1", features = ["unstable_session_usage"] }
adk-agent = "1.0.0"
adk-core = "1.0.0"
adk-model = { version = "1.0.0", default-features = false, features = ["ollama", "openai"] }
adk-runner = "1.0.0"
adk-session = "1.0.0"
adk-tool = "1.0.0"

terrain-core = { path = "crates/terrain-core" }
terrain-agent = { path = "crates/terrain-agent" }
repomix-core = "2.0"
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
# Avoid time 0.3.48 (E0119 with Tauri/cookie blanket From impls; see time-rs/time#783).
time = ">=0.3.36, <0.3.48"

# Patch agent-client-protocol-tokio to hide the console window on Windows
# when spawning ACP agents (opencode-cli, etc.). Upstream uses
# tokio::process::Command without CREATE_NO_WINDOW, causing a black terminal
# window to flash on every ACP delegation.
[patch.crates-io]
agent-client-protocol-tokio = { path = "crates/agent-client-protocol-tokio-patched" }

