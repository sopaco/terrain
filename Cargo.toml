[workspace]
resolver = "2"
members = [
    "crates/terrain-core",
    "crates/terrain-agent",
    "crates/terrain-cli",
    "crates/terrain-ts-export",
    "src-tauri",
]

[workspace.package]
version = "0.9.5"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
slug = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2"
ignore = "0.4"
futures = "0.3"
dotenvy = "0.15"
sys-locale = "0.3"

adk-acp = "2.2.0"
agent-client-protocol = "1.3.0"
adk-agent = "2.2.0"
adk-core = "2.2.0"
adk-model = { version = "2.2.0", default-features = false, features = ["ollama", "openai"] }
adk-runner = "2.2.0"
adk-session = "2.2.0"
adk-tool = "2.2.0"

terrain-core = { path = "crates/terrain-core" }
terrain-agent = { path = "crates/terrain-agent" }
repomix-core = "2.0"
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
# Avoid time 0.3.48 (E0119 with Tauri/cookie blanket From impls; see time-rs/time#783).
time = ">=0.3.36, <0.3.48"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
